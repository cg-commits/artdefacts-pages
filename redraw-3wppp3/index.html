/* ---------- diagrams: mermaid ----------

/* ---------------------------------------------------------------- Board: fields take on the style; only colour marks a state

.ss-board-chapters:empty { display: none; }

.ss-side-item[draggable="true"] { cursor: grab; }

.ss-side-move { margin-left: 0.5em; font: inherit; font-size: 0.78em; color: var(--muted); background: transparent; border: 1px solid var(--rule); border-radius: var(--radius); padding: 0 0.3em; opacity: 0; transition: opacity 0.15s; }

html[data-board] main.page > hr { display: none; } /* a Board shows its --- as tabs */

.ss-board-tab-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ss-board-scroll { overflow-x: auto; margin: 0 0 var(--para, 1.2em); }

/* the owner's "Add a row" under a table: quiet until pointed at */
.ss-board-addrow { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 0.4em; margin: 0.35em 0 0; padding: 0.2em 0.5em; border-radius: var(--radius); font-size: 0.8em; color: var(--muted); cursor: pointer; }
.ss-board-addrow:hover { color: var(--accent); background: var(--code-bg); }
.ss-board-addrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media print { .ss-board-addrow { display: none; } }
.ss-slider-value { display: inline-block; min-width: 2ch; margin-left: 0.5em; font-variant-numeric: tabular-nums; color: var(--muted); }
/* a choice: a small pill, in a menu when it can be changed */
.ss-choice { --c: var(--accent); display: inline-block; font-size: 0.86em; font-weight: 600; line-height: 1.3; padding: 0.22em 0.75em; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 14%, transparent); color: color-mix(in srgb, var(--c) 72%, var(--fg)); }
.ss-choice.is-first, .ss-choice.is-empty, .ss-choice.is-other { --c: var(--muted); }
.ss-choice.is-empty { border-style: dashed; background: transparent; font-weight: 400; }
.ss-choice.is-last { --c: var(--board-done); }
select.ss-choice { cursor: pointer; appearance: none; -webkit-appearance: none; padding-right: 1.7em; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: right 0.85em top 55%, right 0.55em top 55%; background-size: 0.3em 0.3em; background-repeat: no-repeat; }
select.ss-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select.ss-choice option { color: var(--fg); background: var(--bg); font-weight: 400; }
.ss-board-tasks { list-style: none; padding-left: 0; }
.ss-board-tasks li { padding-left: calc(var(--indent, 0) * 1.4em); }
[data-board] .ss-board-tasks li:has(> input:checked) { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
/* views: Table | Columns; cards in one column per choice */
.ss-board-viewbar { display: flex; align-items: center; gap: 0.6em; margin: 0 0 0.6em; font-size: 0.86em; }
.ss-board-views { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; }
.ss-board-views button { all: unset; cursor: pointer; padding: 0.25em 0.9em; border-radius: 999px; color: var(--muted); font-weight: 600; }
.ss-board-views button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.ss-board-views button:focus-visible, .ss-board-by:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ss-board-by { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--rule); border-radius: var(--radius); padding: 0.2em 0.5em; }
.is-columns > :not(.ss-board-columns) { display: none; }
/* Timeline: a time tracking table's tasks as bars on one time scale; the names left, the scale's lines behind the bars */
.is-timeline > :not(.ss-timeline) { display: none; }
.ss-timeline { --tl-name: min(11em, 34%); margin: 0 0 var(--para, 1.2em); font-size: 0.92em; }
.ss-tl-head, .ss-tl-row { display: grid; grid-template-columns: var(--tl-name) minmax(0, 1fr); gap: 0 0.9em; align-items: center; }
.ss-tl-scale { position: relative; height: 1.7em; }
.ss-tl-tick { position: absolute; top: 0; transform: translateX(-50%); color: var(--muted); font-size: 0.8em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ss-tl-tick:first-child { transform: none; }
.ss-tl-tick:last-child:not(:first-child) { transform: translateX(-100%); }
.ss-tl-body { position: relative; border-top: 1px solid var(--rule); }
.ss-tl-lines { position: absolute; inset: 0 0 0 calc(var(--tl-name) + 0.9em); pointer-events: none; }
.ss-tl-lines span { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--rule); }
.ss-tl-lines .ss-tl-now { border-left: 2px solid var(--accent); }
.ss-tl-row { min-height: 2.4em; border-bottom: 1px solid var(--rule); }
.ss-tl-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.ss-tl-track { position: relative; height: 1.25em; }
.ss-tl-bar { position: absolute; top: 0; bottom: 0; border-radius: 0.3em; background: var(--accent); }
.ss-tl-bar.is-running { background: repeating-linear-gradient(-45deg, var(--accent) 0 6px, color-mix(in srgb, var(--accent) 45%, transparent) 6px 12px); }
.ss-tl-bar.is-over { box-shadow: inset 0 0 0 2px var(--fg); }
.ss-tl-label { position: absolute; top: 50%; transform: translateY(-50%); padding: 0 0.5em; color: var(--muted); font-size: 0.82em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ss-tl-none, .ss-tl-empty { color: var(--muted); font-size: 0.82em; }
.ss-track-off { margin: 0 0 0.6em; color: var(--muted); font-size: 0.86em; }
@media print { .ss-track-off { display: none; } }
.ss-board-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(11em, 100%), 1fr)); gap: 0.9em; margin: 0 0 var(--para, 1.2em); } /* no room: the next column goes below, nothing is cut */
.ss-board-lane { background: color-mix(in srgb, var(--fg) 3.5%, transparent); border: 1px solid var(--rule); border-radius: calc(var(--radius) + 4px); padding: 0.6em; min-height: 6em; transition: background 0.15s; }
.ss-board-lane.is-over { background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: var(--accent); }
.ss-board-lane-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 0.6em; font-size: 1em; }
.ss-board-count { color: var(--muted); font: 600 0.82em/1 var(--font-mono); }
.ss-board-card { background: var(--bg); border: 1px solid var(--rule); border-radius: var(--radius); padding: 0.6em 0.7em; margin: 0 0 0.5em; font-size: 0.92em; }
.ss-board-card[draggable="true"] { cursor: grab; }
.ss-board-card.is-dragging { opacity: 0.45; }
.ss-board-card-name { font-weight: 650; margin: 0 0 0.3em; }
.ss-board-card-facts { display: grid; grid-template-columns: auto 1fr; gap: 0.15em 0.7em; margin: 0; font-size: 0.9em; }
.ss-board-card-facts dt { color: var(--muted); }
.ss-board-card-facts dd { margin: 0; }
.ss-board-move { margin-top: 0.5em; font-size: 0.78em; }
/* time tracking: a round ▶ in front of each task, filled in the accent; the running one is a ring with ■ and its clock */
.ss-timer-row { display: flex; align-items: center; gap: 0.55em; }
.ss-timer-go { flex: none; display: grid; place-items: center; width: 1.75em; height: 1.75em; margin: 0; padding: 0; border: 0; border-radius: 50%; background: var(--accent); color: var(--bg); cursor: pointer; }
.ss-timer-go svg { display: block; width: 62%; height: 62%; }
.ss-timer-go:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.ss-timer-go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ss-timer-go:disabled { cursor: progress; }
.ss-timer-go.is-running { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.ss-timer-go.is-running:hover { box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.ss-timer-run { flex: none; color: var(--accent); font-variant-numeric: tabular-nums; font-size: 0.85em; font-weight: 650; }
td.is-editing .ss-timer-row { display: none; }
td.is-stamp { width: 9.5ch; }
.ss-stamp { display: inline-grid; line-height: 1.2; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ss-stamp small { color: var(--muted); font-size: 0.78em; }
.ss-stamp.is-running { color: var(--accent); font-weight: 650; }
@media print { .ss-timer-go, .ss-timer-run { display: none; } .ss-timer-row { display: block; } }
/* a date's or slider's value as text, for paper only */
.ss-print-value { display: none; }
/* a reader's copy: what it is, and Save. ARTdeFACTS's own strip, the same in every style: black, a yellow edge, the dot-matrix label */
.ss-board-copy { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "label text save"; align-items: center; gap: 0.5em 1.4em; margin: 0 0 1.8em; padding: 0.75em 0.8em 0.75em 1em; background: #000; color: #fff; border: 1px solid #ffd400; border-radius: 3px; box-shadow: 4px 4px 0 #ffd400; font-size: 0.9em; line-height: 1.4; }
.ss-board-copy p { margin: 0; }
/* the strip's own type, the same on every page: no style's p, button or summary rule reaches it */
.ss-board-copy, .ss-board-copy :is(p, span, small, button, summary) { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-style: normal; font-variant: normal; text-transform: none; letter-spacing: normal; word-spacing: normal; text-shadow: none; }
.ss-board-copy :is(p, button, summary) { font-size: inherit; line-height: 1.4; }
.ss-board-copy .ss-board-copy-label { grid-area: label; align-self: start; justify-self: start; display: inline-flex; align-items: center; gap: 0.5em; color: #ffd400; font-weight: 900; font-size: 1.3em; letter-spacing: 0.02em; line-height: 1; white-space: nowrap; }
.ss-board-copy-light { width: 0.42em; height: 0.42em; border-radius: 50%; background: #ffd400; opacity: 0.45; }
.ss-board-copy-light.is-kept { animation: ss-kept 0.9s ease-out; }
@keyframes ss-kept { 0% { opacity: 1; box-shadow: 0 0 0 0 rgba(255, 212, 0, 0.7); } 100% { opacity: 0.45; box-shadow: 0 0 0 0.7em rgba(255, 212, 0, 0); } }
@media (prefers-reduced-motion: reduce) { .ss-board-copy-light.is-kept { animation: none; } }
.ss-board-copy .ss-board-copy-text { grid-area: text; text-align: center; color: #fff; font-weight: 400; }
/* narrow: the label and Save share the first row, the sentence goes below */
@media (max-width: 640px) { .ss-board-copy { grid-template-columns: 1fr auto; grid-template-areas: "label save" "text text"; } .ss-board-copy .ss-board-copy-label { align-self: center; } }
.ss-board-copy.is-top { position: fixed; z-index: 60; top: 0; left: 0; right: 0; box-sizing: border-box; margin: 0; padding: 0.6em 16px; border: 0; border-bottom: 3px solid #ffd400; border-radius: 0; box-shadow: none; font-size: 15px; line-height: 1.4; text-align: left; }
.ss-board-copy-space { display: block; }
.ss-board-copy.is-floating { position: fixed; left: 16px; bottom: 16px; z-index: 50; margin: 0; max-width: min(32em, calc(100vw - 32px)); box-sizing: border-box; font-size: 14px; line-height: 1.4; text-align: left; }
.ss-board-copy.is-floating .ss-board-save-menu { top: auto; bottom: 100%; margin: 0 0 6px; }
.ss-board-save { grid-area: save; justify-self: end; position: relative; }
.ss-board-save > summary { list-style: none; cursor: pointer; padding: 0.4em 1.1em; border-radius: 3px; background: #6d28d9; color: #fff; font-weight: 700; }
.ss-board-save > summary:hover { background: #5b21b6; }
.ss-board-save > summary::-webkit-details-marker { display: none; }
.ss-board-save > summary:focus-visible { outline: 2px solid #ffd400; outline-offset: 2px; }
.ss-board-save-menu { position: absolute; right: 0; z-index: 30; min-width: 16em; margin-top: 8px; padding: 6px; background: #000; border: 1px solid #ffd400; border-radius: 3px; box-shadow: 4px 4px 0 #ffd400; }
.ss-board-save-menu button { all: unset; box-sizing: border-box; display: grid; width: 100%; padding: 0.45em 0.6em; border-radius: 2px; cursor: pointer; }
.ss-board-save-menu button:hover, .ss-board-save-menu button:focus-visible { background: #6d28d9; }
.ss-board-save-menu span { font-weight: 700; color: #fff; }
.ss-board-save-menu small { color: #b3b3b3; font-size: 0.85em; }
.ss-board-save-menu button:hover small, .ss-board-save-menu button:focus-visible small { color: #e9e2fb; }
.ss-board-save-note { margin: 0.4em 0.6em 0.2em; font-size: 0.85em; color: #b3b3b3; }
/* a tab's parts are hidden with [hidden]; a block a rule sets to display (a picture on its own: .page > img) still hides */
[data-board-tab][hidden] { display: none !important; }
@media print {
  .ss-board-tabs, .ss-board-viewbar, .ss-board-columns, .ss-board-copy, .ss-board-copy-space { display: none; }
  .is-columns > :not(.ss-board-columns), .is-timeline > :not(.ss-timeline) { display: block; }
  .ss-timeline { display: none; }
  [data-board-tab][hidden] { display: revert !important; }
  .ss-board-tab-title { position: static; width: auto; height: auto; clip-path: none; }
  .ss-board-scroll { overflow: visible; }
  td.is-editable { box-shadow: none !important; }
  select.ss-choice { background-image: none; padding-right: 0.75em; }
  td input:is([type="date"], [type="range"]), td .ss-slider-value { display: none; }
  .ss-print-value { display: inline; }
}
@media (prefers-reduced-motion: reduce) { .ss-board-input.is-invalid { animation: none; } }

/* diagrams: canvas themed ----------
   One drawing, styled here. Every visual choice reads a --cv-* token with a fallback from the page's own tokens, so any style
   looks right with none; a style sets some of them for its own character. Tokens and defaults: docs/canvas-tokens.md.
   Hand-drawn: a style adds `.diagram-canvas { --cv-filter: var(--cv-rough); }` (--cv-rough is set by the engine, per canvas). */
figure.diagram { margin: 1.6em 0; overflow-x: auto; position: relative; }
.diagram-alt { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
figure.diagram svg { display: block; width: 100%; height: auto; margin: 0 auto; font-family: var(--font-body); overflow: visible; }
.slide figure.diagram svg { max-height: 62vh; }
figure.diagram-canvas { --cv-hue: var(--accent); padding: var(--cv-board-pad, 0px); background-color: var(--cv-board-bg, transparent); background-image: var(--cv-board-grid, none); background-size: var(--cv-board-grid-size, auto); border: 1px solid var(--cv-board-stroke, transparent); border-radius: var(--cv-board-radius, 0px); }
.cv-c1 { --cv-hue: #e5484d; } .cv-c2 { --cv-hue: #f08a24; } .cv-c3 { --cv-hue: #e0b400; } .cv-c4 { --cv-hue: #3fa56b; } .cv-c5 { --cv-hue: #1fa5b8; } .cv-c6 { --cv-hue: #8e5bd6; }
/* cards: a hard shadow, a fill, an outline, a colour bar, a code chip, then the text */
.cv-shadow { fill: var(--cv-shadow, transparent); stroke: var(--cv-shadow, transparent); stroke-width: var(--cv-card-stroke-w, 1.5px); transform: translate(var(--cv-shadow-x, 0px), var(--cv-shadow-y, 0px)); rx: var(--cv-card-radius, var(--radius, 8px)); filter: var(--cv-filter, none); }
.cv-fill { fill: var(--cv-card-bg, var(--code-bg)); stroke: none; rx: var(--cv-card-radius, var(--radius, 8px)); filter: var(--cv-filter, none); }
.cv-card.cv-hue .cv-fill { fill: color-mix(in srgb, var(--cv-hue) var(--cv-card-tint, 22%), var(--cv-card-bg, var(--code-bg))); }
.cv-outline { fill: none; stroke: var(--cv-card-stroke, var(--rule)); stroke-width: var(--cv-card-stroke-w, 1.5px); stroke-dasharray: var(--cv-card-dash, none); rx: var(--cv-card-radius, var(--radius, 8px)); filter: var(--cv-filter, none); }
.cv-card.cv-hue .cv-outline { stroke: var(--cv-card-stroke, var(--cv-hue)); }
.cv-bar { fill: none; stroke: var(--cv-hue); stroke-width: var(--cv-bar-w, 0px); transform: translateX(calc(var(--cv-bar-w, 0px) / 2)); }
.cv-chip { display: var(--cv-chip, none); }
.cv-chip rect { fill: var(--bg); stroke: var(--cv-card-stroke, var(--rule)); stroke-width: 1.5px; }
.cv-chip text { fill: var(--fg); font: 700 11px var(--font-mono, monospace); }
.cv-text { fill: var(--cv-text-color, var(--fg)); font-family: var(--cv-text-font, var(--font-body)); font-size: calc(var(--cv-text-size, 16px) * var(--cv-font-scale, 1)); }
.cv-title { font-family: var(--cv-title-font, var(--cv-text-font, var(--font-body))); font-weight: var(--cv-title-weight, 700); font-size: var(--cv-title-size, 1em); text-transform: var(--cv-title-case, none); letter-spacing: var(--cv-title-spacing, normal); }
.cv-linktext { font-family: var(--font-mono, monospace); }
/* groups: a region, and its name on a tab above it */
.cv-group-bg { fill: var(--cv-group-bg, transparent); stroke: var(--cv-group-stroke, var(--rule)); stroke-width: var(--cv-group-stroke-w, 1.5px); stroke-dasharray: var(--cv-group-dash, 7 5); rx: var(--cv-group-radius, var(--radius, 8px)); filter: var(--cv-filter, none); }
.cv-group.cv-hue .cv-group-bg { stroke: var(--cv-group-stroke, var(--cv-hue)); }
.cv-group-tab { fill: var(--cv-group-label-bg, transparent); }
.cv-group-label { fill: var(--cv-group-label-fg, var(--muted)); font-family: var(--cv-label-font, var(--font-body)); font-size: 14px; }
/* edges: a line, a head at the end (and a dot or a head at the start), ports where it meets a card, a label on it */
.cv-edge { fill: none; stroke: var(--cv-edge, var(--accent)); stroke-width: var(--cv-edge-w, 2px); stroke-dasharray: var(--cv-edge-dash, none); stroke-linecap: var(--cv-edge-cap, round); filter: var(--cv-filter, none); }
.cv-edge-g.cv-hue .cv-edge { stroke: var(--cv-hue); }
.cv-end { fill: var(--cv-edge, var(--accent)); stroke: none; display: var(--cv-head, inline); transform: scale(var(--cv-head-size, 1)); }
.cv-edge-g.cv-hue .cv-end { fill: var(--cv-hue); }
.cv-start { fill: var(--cv-edge, var(--accent)); display: var(--cv-start, none); }
.cv-edge-g.cv-hue .cv-start { fill: var(--cv-hue); }
.cv-port { fill: var(--bg); stroke: var(--cv-edge, var(--accent)); stroke-width: 2px; display: var(--cv-port, none); }
.cv-edge-g.cv-hue .cv-port { stroke: var(--cv-hue); }
.cv-label-bg { fill: var(--cv-label-bg, var(--bg)); stroke: var(--cv-label-stroke, var(--rule)); rx: var(--cv-label-radius, 11px); }
.cv-label-text { fill: var(--cv-label-fg, var(--fg)); font-family: var(--cv-label-font, var(--font-body)); font-size: 13px; }
@media print { figure.diagram { break-inside: avoid; } }

/* a spreadsheet table inside a slide stays inside the slide */
.slide .ss-sheet-scroll { max-height: 56vh; }
.slide .ss-board-columns { display: flex; overflow-x: auto; max-height: 56vh; overflow-y: auto; } /* Columns on a slide scroll inside it */
.slide .ss-board-lane { flex: 1 1 0; min-width: min(11em, 80%); } /* lanes share the slide's width; only when they don't fit does it scroll */
.ss-table-tools { margin: 0 0 var(--para, 1.2em); }
.ss-table-tools > table, .ss-table-tools > .ss-board-scroll { margin-bottom: 0; }

/* a task already has its checkbox: no style bullet in front of it */
li:has(> input[type="checkbox"])::before, li:has(> p > input[type="checkbox"]:first-child)::before { content: none !important; display: none !important; }

/* a page with Columns or cards side by side widens like a Board (up to 80rem), so three or four sit next to each other
   and the headline, the text and the cards share one left edge; text keeps its reading width. A style that frames its
   page keeps its width. Wide blocks span a style's whole grid. */
html.ss-wide:not(.ss-framed) main.page { max-width: min(80rem, 100%); box-sizing: border-box; }
html.ss-wide:not(.ss-framed) main.page > :is(p, ol, ul:not(.ss-board-tasks), blockquote, dl, pre) { max-width: var(--measure); }
main.page > :is(.ss-board-table:has(.ss-board-views), .ss-side) { grid-column: 1 / -1; }

/* a Board on a phone (last, so it wins over the rules above): everything one below the other, nothing to swipe sideways.
   Columns stack, tabs wrap, and each table row becomes a card with its field names (a spreadsheet stays a grid). */
@media (max-width: 640px) {
  .ss-board-columns { grid-template-columns: 1fr; }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) { overflow: visible; }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board { display: block; min-width: 0; width: 100%; border: 0; }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board tbody { display: grid; gap: 0.7em; }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board tr { display: block; padding: 0.55em 0.85em; border: 1px solid var(--rule); border-radius: calc(var(--radius) + 4px); background: color-mix(in srgb, var(--fg) 3.5%, transparent); }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board td { display: grid; grid-template-columns: minmax(5.5em, 40%) minmax(0, 1fr); align-items: center; gap: 0.2em 0.8em; padding: 0.3em 0; border: 0; text-align: left !important; white-space: normal; background: none; }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board td::before { content: attr(data-label); color: var(--muted); font-size: 0.86em; }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board td.is-stamp { width: auto; }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board td.is-slider { grid-template-columns: minmax(5.5em, 40%) minmax(0, 1fr) auto; }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board td.ss-board-name { display: block; padding: 0.15em 0 0.35em; margin-bottom: 0.2em; border-bottom: 1px solid var(--rule); font-size: 1.05em; }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board td.ss-board-name::before { content: none; }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board tr.is-total { background: none; border-style: dashed; }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board tr.is-total td:not(.ss-board-name):not(:has(.ss-calc)) { display: none; }
  [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board .ss-board-input, [data-board] .ss-board-scroll:not(.ss-sheet-scroll) table.ss-board input[type="range"] { min-width: 0; max-width: 100%; }
}

/* ---------- Tiles ----------
   A note's > [!tile] callouts on a grid. Snap: 6 columns, tiles in note order, each as tall as its content needs
   (at least its rows). Free: 24 columns, a quarter-height row, each tile at its own place. Anything that isn't a tile
   (the title, the intro, a ## section) runs across the page. */
main.ss-tiles { max-width: 1200px; }
main.ss-tiles :is(h1, h2)::before { margin-left: 0; } /* a style's "# " hung left of a heading stays inside the wide Tiles page */
.ss-masthead-date { margin: -0.5em 0 var(--para); color: var(--muted); }
.ss-tile-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: minmax(64px, auto); grid-auto-flow: row dense; gap: 14px; margin: 0 0 calc(var(--para) * 1.4); }
.ss-tiles[data-tiles="free"] .ss-tile-grid { grid-template-columns: repeat(24, minmax(0, 1fr)); grid-auto-rows: minmax(12px, auto); grid-auto-flow: row; gap: 6px; }
.ss-tile { position: relative; min-width: 0; grid-column: span var(--w, 2); grid-row: span var(--h, 2); display: flex; flex-direction: column; padding: 18px 20px; background: var(--bg); color: var(--fg); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.ss-tiles[data-tiles="free"] .ss-tile { grid-column: var(--c, auto) / span var(--w, 8); grid-row: var(--r, auto) / span var(--h, 8); }
.ss-tile-title { margin: 0 0 0.45em; font-size: 1.3em; line-height: 1.2; }
.ss-tile:not([data-kind="text"]) > .ss-tile-title { font-size: 0.82em; font-weight: 650; color: var(--muted); letter-spacing: 0.01em; }
.ss-tile-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.ss-tile-body > :last-child { margin-bottom: 0; }
.ss-tile-body table { font-size: 0.9em; }
.ss-tile[data-kind="image"] { padding: 0; }
.ss-tile[data-kind="image"] > .ss-tile-title { padding: 12px 16px 0; }
.ss-tile[data-kind="image"] .ss-tile-body > * { flex: 1; margin: 0; display: flex; min-height: 0; }
.ss-tile[data-kind="image"] .ss-tile-body img { flex: 1; width: 100%; height: 100%; min-height: 0; object-fit: cover; margin: 0; border-radius: 0; }
.ss-data-number { margin: 0; font-size: 2.3em; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--live); }
.ss-ticker-run span, .ss-tile[data-kind="data"] :is(td, .ss-data-list li) { color: var(--live); }
/* the Live chip next to a data tile's title: a dot that breathes (still with reduced motion); Offline in grey */
.ss-live { display: inline-flex; align-items: center; gap: 0.35em; margin-left: 0.4em; padding: 0.05em 0.55em; border: 1px solid currentColor; border-radius: 999px; font: 600 0.72rem/1.5 var(--font-body); letter-spacing: 0.02em; vertical-align: 0.15em; color: var(--live); white-space: nowrap; }
.ss-live::before { content: ""; width: 0.45em; height: 0.45em; border-radius: 50%; background: currentColor; animation: ss-live 2s ease-in-out infinite; }
.ss-live.is-stale { color: var(--muted); }
.ss-live.is-stale::before { animation: none; }
@keyframes ss-live { 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .ss-live::before { animation: none; } }
.ss-data-change { margin: 0.2em 0 0; font-size: 0.85em; color: var(--muted); font-variant-numeric: tabular-nums; }
.ss-data-empty { margin: 0; color: var(--muted); }
.ss-asof-line { margin: auto 0 0; padding-top: 0.6em; font-size: 0.75em; color: var(--muted); display: flex; gap: 0.8em; flex-wrap: wrap; }
.ss-data-stale::before { content: "● "; }
.ss-data-list, .ss-tile .ss-chart-legend { list-style: none; padding: 0 !important; margin-left: 0 !important; }
.ss-data-list { margin: 0; }
.ss-data-list li { margin: 0; padding: 0.4em 0; line-height: 1.3; }
.ss-data-list li + li { border-top: 1px solid var(--rule); }
.ss-ticker { overflow: hidden; white-space: nowrap; font-variant-numeric: tabular-nums; -webkit-mask-image: linear-gradient(90deg, transparent, black 6%, black 94%, transparent); mask-image: linear-gradient(90deg, transparent, black 6%, black 94%, transparent); }
.ss-ticker-run { display: inline-flex; animation: ss-ticker 40s linear infinite; }
.ss-ticker-run span { display: inline-flex; gap: 0.4em; padding-right: 2em; }
.ss-ticker-again { padding-right: 0 !important; gap: 0 !important; }
.ss-ticker b { color: var(--muted); font-weight: 600; }
@keyframes ss-ticker { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .ss-ticker { white-space: normal; -webkit-mask-image: none; mask-image: none; } .ss-ticker-run { animation: none; flex-wrap: wrap; } .ss-ticker-again { display: none !important; } }
.ss-tile[data-kind="chart"] .ss-tile-body > :not(.ss-chart-wrap) { display: none; } /* the table it is drawn from stays in the note */
.ss-chart { display: block; width: 100%; height: auto; color: var(--fg); }
.ss-chart.is-pie { max-width: 180px; margin: 0 auto; }
.ss-chart-grid { stroke: var(--rule); stroke-width: 1; }
.ss-chart-axis { fill: var(--muted); font: 12px var(--font-body); }
.ss-chart-dot, .ss-chart-slice { stroke: var(--bg); stroke-width: 2; }
.ss-chart-legend { list-style: none; padding: 0; margin: 0.5em 0 0; display: flex; flex-wrap: wrap; gap: 0.2em 1em; font-size: 0.8em; color: var(--muted); }
.ss-chart-legend li { margin: 0; }
.ss-tile .ss-chart-legend > li::before, .ss-tile .ss-data-list > li::before { content: none !important; display: none !important; } /* a style's list marks: not on a legend or a feed */
.ss-tile .ss-chart-legend > li, .ss-tile .ss-data-list > li { padding-left: 0 !important; }
.ss-chart-legend i { display: inline-block; width: 0.7em; height: 0.7em; border-radius: 2px; margin-right: 0.4em; }
.ss-tile-clock { font-size: 2.4em; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.ss-tile-clock svg { display: block; width: 100%; max-width: 150px; height: auto; margin: 0 auto; }
/* the owner's controls in the ARTdeFACTS view: a grip to move, a corner to size, + and − (the artdefacts plus and minus) */
.ss-tile-grip, .ss-tile-del, .ss-tile-add, .ss-tile-edit { all: unset; box-sizing: border-box; position: absolute; z-index: 5; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 3px; color: var(--fg); background: var(--code-bg); cursor: pointer; opacity: 0; transition: opacity 0.15s; }
.ss-tile-grip { top: 2px; left: 50%; width: 34px; height: 16px; transform: translateX(-50%); cursor: grab; touch-action: none; }
/* the corner to size sits inside a round edge (0.29 × the radius is where the curve is at 45°); the buttons left of it */
.ss-tile { --corner: max(0px, calc(var(--radius) * 0.29)); }
.ss-tile > .ss-export { top: calc(var(--corner) + 8px); right: calc(var(--corner) + 8px); } /* inside a round edge too */
.ss-tile-del { right: calc(var(--corner) + 20px); bottom: 4px; } /* the export icon has the top corner */
.ss-tile-add { bottom: 4px; color: var(--accent); }
.ss-tile-add.is-end { position: relative; right: auto; bottom: auto; width: auto; height: auto; min-height: 64px; grid-column: span 1; grid-row: span 1; border: 1px dashed var(--rule); background: none; opacity: 0.7; }
.ss-tiles[data-tiles="free"] .ss-tile-add.is-end { grid-column: span 4; grid-row: span 4; }
.ss-tile-size { position: absolute; z-index: 6; right: var(--corner); bottom: var(--corner); width: 16px; height: 16px; cursor: nwse-resize; touch-action: none; opacity: 0; background: linear-gradient(135deg, transparent 55%, var(--muted) 55%, var(--muted) 65%, transparent 65%, transparent 75%, var(--muted) 75%, var(--muted) 85%, transparent 85%); }
.ss-tile:hover > :is(.ss-tile-grip, .ss-tile-del, .ss-tile-add, .ss-tile-edit, .ss-tile-size), .ss-tile:focus-within > :is(.ss-tile-grip, .ss-tile-del, .ss-tile-add, .ss-tile-edit, .ss-tile-size), .ss-tile-add.is-end:hover, .ss-tile-add.is-end:focus-visible { opacity: 1; }
.ss-tile-add { right: calc(var(--corner) + 48px); }
.ss-tile-edit { right: calc(var(--corner) + 76px); bottom: 4px; }
.ss-tile.is-editing > :is(.ss-tile-title, .ss-tile-body, .ss-tile-grip, .ss-tile-del, .ss-tile-add, .ss-tile-edit, .ss-tile-size, .ss-export) { display: none; }
/* a tile's text being edited: its Markdown fills the tile */
.ss-tile-editor { flex: 1; width: 100%; min-height: 7em; box-sizing: border-box; margin: 0; padding: 0.6em 0.7em; font: 0.82em/1.55 var(--font-mono); color: var(--fg); background: var(--code-bg); border: 1px solid var(--accent); border-radius: var(--radius); resize: none; outline: none; }
:is(.ss-tile-grip, .ss-tile-del, .ss-tile-add, .ss-tile-edit):focus-visible { opacity: 1; outline: 2px solid var(--accent); outline-offset: 1px; }
/* a tile being moved is lifted and follows the pointer; one being sized shows its edge */
/* in the view, room for the grip above the text and the buttons under it */
.ss-tiles-editing .ss-tile:not([data-kind="image"]) { padding-top: 34px; padding-bottom: 40px; }
.ss-tile:has(> .ss-export) > .ss-tile-title { margin-right: 34px; } /* the download icon beside the title, not on it */
.ss-tile.is-moving { outline: 2px solid var(--accent); outline-offset: 2px; z-index: 6; box-shadow: 0 10px 28px color-mix(in srgb, var(--fg) 22%, transparent); cursor: grabbing; }
.ss-tile.is-moving > .ss-tile-grip { cursor: grabbing; }
.ss-tile.is-sizing { outline: 2px solid var(--accent); outline-offset: 2px; z-index: 4; }
.ss-tile-grip::before { content: ""; position: absolute; inset: -6px -12px; } /* a bigger place to grab than the dots */
.ss-tile-drop { border: 2px dashed var(--accent); border-radius: var(--radius); pointer-events: none; z-index: 3; }
.ss-tile-drop[hidden] { display: none; }
.ss-tile-menu { top: auto; bottom: 32px; right: 4px; }
@media (hover: none) { .ss-tiles-editing .ss-tile > :is(.ss-tile-grip, .ss-tile-del, .ss-tile-add, .ss-tile-edit, .ss-tile-size) { opacity: 0.6; } }
@media print { .ss-tile-grip, .ss-tile-del, .ss-tile-add, .ss-tile-edit, .ss-tile-editor, .ss-tile-size, .ss-tile-drop { display: none !important; } }
@media (max-width: 700px) {
  .ss-tile-grid, .ss-tiles[data-tiles="free"] .ss-tile-grid { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; gap: 12px; }
  .ss-tile, .ss-tiles[data-tiles="free"] .ss-tile { grid-column: 1 / -1; grid-row: auto; min-height: 0; }
  .ss-tile[data-kind="image"] img { max-height: 60vh; }
}
@media print { .ss-tile { break-inside: avoid; } }

/* style: swedish-engineering */
/* swedish-engineering — after the Stockholm makers of pocket synths and very orange gadgets: blue-grey grid paper (a one-pixel pale line every 26px), chunky blocks with a hard black edge, one signal orange, white tabs and black tabs, numbered library rows, tiny tracked labels */
:root {
  --category: Design;
  --bg: #abb5ba;
  --fg: #181616;
  --muted: #3a444a;
  --accent: #6e2004; /* orange as text: dark enough for the grey-blue paper; the blocks use --led */
  --rule: #7d8a91;
  --code-bg: #000005;
  --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-head: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --size: 17px;
  --leading: 1.5;
  --tracking: 0.02em;
  --para: 1em;
  --measure: 62ch;
  --radius: 0px;
  --head-weight: 700;
  --head-tracking: 0.04em;
  --led: #f15a22;
  --lcd: #00a69c;
  --panel: #000005;
  --panel-fg: #e5e6e6;
  --plate: #dbdddb;
  --edge: #000005;
  --seam: #d7dadb; /* the reference's grid line colour, one pixel */
  --board: transparent; /* the page's own grid shows through the canvas */
}
:root[data-theme="dark"] {
  --bg: #262b2e;
  --fg: #e5e6e6;
  --muted: #abb5ba;
  --accent: #ff8a5c;
  --rule: #4a5358;
  --plate: #353c40;
  --edge: #000005;
  --seam: rgba(171, 181, 186, 0.14);
  --board: rgba(0, 0, 0, 0.2);
}

/* grid paper, as on the reference: blue-grey with a one-pixel line every 26px */
html {
  background-image: linear-gradient(var(--seam) 1px, transparent 1px), linear-gradient(90deg, var(--seam) 1px, transparent 1px);
  background-size: 26px 26px;
  background-position: 25px 25px;
}

/* the title: an orange block with a hard black edge, like a key cap */
h1 { display: inline-block; font-size: 2.4em; line-height: 1.08; text-transform: uppercase; letter-spacing: 0.02em; background: var(--led); color: #fff; padding: 0.18em 0.45em 0.22em; box-shadow: 6px 6px 0 var(--edge); }
/* section tabs: a plate with a black edge, small and tracked */
h2 { display: inline-block; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.18em; background: var(--plate); color: var(--fg); padding: 0.4em 1em; margin-top: 2em; box-shadow: 4px 4px 0 var(--edge); }
h3 { display: inline-block; font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.18em; background: var(--panel); color: var(--panel-fg); padding: 0.4em 0.9em; }
a { color: var(--fg); text-decoration-color: var(--led); text-decoration-thickness: 3px; text-underline-offset: 0.2em; }
a:hover { background: var(--led); color: #000005; text-decoration: none; }
mark { background: var(--led); color: #000005; padding: 0 0.25em; }

/* lists read as rows of a library: ruled, with a small hole in front */
ul, ol { list-style: none; padding-left: 0; margin-left: 0; }
li { position: relative; padding: 0.3em 0.2em 0.3em 2.2em; border-bottom: 1px solid var(--rule); }
ul > li::before { content: ""; position: absolute; left: 0.55em; top: 0.85em; width: 0.7em; height: 0.7em; border: 1.5px solid var(--fg); border-radius: 50%; }
ul > li:first-child::before { background: var(--led); }
ol { counter-reset: row; }
ol > li { counter-increment: row; }
ol > li::before { content: counter(row, decimal-leading-zero); position: absolute; left: 0.2em; top: 0.38em; font-family: var(--font-mono); font-size: 0.8em; letter-spacing: 0.08em; color: var(--muted); }
li ul, li ol { margin: 0.3em 0 0; }
li li:last-child { border-bottom: 0; }

code { background: var(--panel); color: var(--lcd); border-radius: 0; padding: 0.1em 0.4em; }
pre { background: var(--panel); border-radius: 0; box-shadow: 6px 6px 0 var(--edge); }
pre code { padding: 0; }

/* a quote is the alert bar: orange with a white square carrying "!" */
blockquote { position: relative; border: 0; margin: 1.6em 0; padding: 0.9em 1.2em 0.9em 4em; background: var(--led); color: #000005; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; box-shadow: 6px 6px 0 var(--edge); }
blockquote::before { content: "!"; position: absolute; left: 0; top: 0; bottom: 0; width: 2.8em; display: flex; align-items: center; justify-content: center; background: var(--plate); color: #000005; font-size: 1.6em; }
blockquote p { margin: 0; }

.callout { background: var(--plate); color: var(--fg); border: 0; border-radius: 0; box-shadow: 6px 6px 0 var(--edge); }
.callout-title { display: inline-block; background: var(--panel); color: var(--panel-fg); padding: 0.2em 0.8em; font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.18em; }
.callout-title::before { content: "■ "; color: var(--led); }
table { border-collapse: collapse; background: var(--plate); color: var(--fg); box-shadow: 6px 6px 0 var(--edge); }
th { background: var(--panel); color: var(--panel-fg); font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.16em; border: 0; }
td { border-bottom: 1px solid var(--rule); }
img { border-radius: 0; box-shadow: 6px 6px 0 var(--edge); }
hr { border: 0; border-top: 2px solid var(--fg); }
.slide h1 { font-size: 3.4em; }

/* canvas: a patch bay on the same paper. A board with a hard edge, chunky key-cap cards (a hard black edge, a code tab in the corner), groups with a black name tab, black wires that end in sockets, an orange dot where a line starts, an orange tag for the wire label. */
.diagram-canvas {
  --cv-board-bg: var(--board); --cv-board-stroke: var(--edge); --cv-board-radius: 0px; --cv-board-pad: 14px;
  --cv-card-bg: var(--plate); --cv-card-tint: 34%; --cv-card-stroke: var(--edge); --cv-card-stroke-w: 2px; --cv-card-radius: 0px; --cv-chip: block;
  --cv-shadow: var(--edge); --cv-shadow-x: 6px; --cv-shadow-y: 6px;
  --cv-title-font: var(--font-body); --cv-title-weight: 700; --cv-title-case: uppercase; --cv-title-spacing: 0.12em; --cv-text-size: 14px;
  --cv-group-bg: transparent; --cv-group-stroke: var(--fg); --cv-group-stroke-w: 2px; --cv-group-dash: none; --cv-group-radius: 0px;
  --cv-group-label-bg: var(--panel); --cv-group-label-fg: var(--panel-fg);
  --cv-edge: var(--fg); --cv-edge-w: 2.5px; --cv-edge-cap: butt; --cv-port: inline; --cv-start: inline; --cv-head: none;
  --cv-label-bg: var(--led); --cv-label-fg: #000005; --cv-label-stroke: var(--edge); --cv-label-radius: 0px; --cv-label-font: var(--font-body);
}
.diagram-canvas .cv-start { fill: var(--led); }

/* a column head is a black display: its state reads in the display's own colours */
.ss-board-lane-head .ss-choice { color: var(--panel-fg); border-color: color-mix(in srgb, var(--panel-fg) 50%, transparent); background: transparent; }


.ss-mark { margin: 5rem 0 0; padding: 0 16px 3rem; text-align: center; font-family: var(--font-body, system-ui, sans-serif); font-size: 13px; line-height: 1.4; font-weight: 400; letter-spacing: 0; text-transform: none; }
.ss-mark a { display: inline-flex; flex-direction: column; align-items: center; gap: 0.15rem; min-height: 44px; justify-content: center; padding: 0 0.6rem; color: var(--muted, currentColor); opacity: 0.85; text-decoration: none; transition: none; }
.ss-mark a:hover, .ss-mark a:focus-visible { color: var(--fg, currentColor); opacity: 1; }
.ss-mark a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 4px; }
.ss-mark-t { display: inline-flex; align-items: center; gap: 0.35em; }
.ss-mark-h { width: 1.05em; height: 1.05em; fill: #e5383b; }
.ss-mark-w { height: 0.78em; width: 8.35em; fill: currentColor; margin-top: 0.05em; }
.ss-mark-s { font-size: 0.92em; opacity: 0.9; }
@media print { .ss-mark { display: none; } }


@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] { color-scheme: dark; }
  :root[data-theme="auto"] { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; }
  :root[data-theme="auto"] { color-scheme: dark; }
  :root[data-theme="auto"] { --bg: #262b2e;
  --fg: #e5e6e6;
  --muted: #abb5ba;
  --accent: #ff8a5c;
  --rule: #4a5358;
  --plate: #353c40;
  --edge: #000005;
  --seam: rgba(171, 181, 186, 0.14);
  --board: rgba(0, 0, 0, 0.2); }
}

</style>
</head>

<details class="ss-gear"><summary aria-label="Menu" title="Menu"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></summary><div class="ss-gear-panel">

<nav class="ss-overview ss-board-chapters" aria-label="Chapters"></nav>
<p class="ss-gear-saved" hidden>Changes here are saved in the note.</p>
</div></details>
<script>
(() => {
  const root = document.documentElement, gear = document.querySelector('.ss-gear');
  const send = (key, value) => {
    dispatchEvent(new CustomEvent('ss-note', { detail: { key, value } }));
    if (parent !== window) parent.postMessage({ ssNote: { key, value } }, '*');
  };
  const fieldOf = k => gear.querySelector('[data-note="' + k + '"]:not([data-opt])');
  // in the ARTdeFACTS view the menu writes into the note: it says so
  if (parent !== window) { const saved = gear.querySelector('.ss-gear-saved'); if (saved) saved.hidden = false; }
  gear.querySelectorAll('input[data-opt]').forEach(box => {
    const k = box.dataset.opt, field = box.dataset.field && fieldOf(box.dataset.field);
    const apply = () => root.classList.toggle('ss-no-' + k, !box.checked);
    // a switch with a value beside it (clock format, timer minutes) writes that value, or "off"
    box.addEventListener('change', () => { apply(); send(box.dataset.note, field ? (box.checked ? field.value : 'off') : String(box.checked)); });
    apply();
  });
  gear.querySelectorAll('[data-note]:not([data-opt])').forEach(field => {
    field.addEventListener('change', () => {
      const box = gear.querySelector('input[data-field="' + field.dataset.note + '"]');
      if (box && !box.checked) { box.checked = true; root.classList.remove('ss-no-' + box.dataset.opt); }
      send(field.dataset.note, field.value);
    });
    field.addEventListener('click', e => e.stopPropagation());
    field.addEventListener('keydown', e => e.stopPropagation());
  });
  const nav = gear.querySelector('.ss-overview');
  if (nav) {
    const slides = [...document.querySelectorAll('.slide')];
    slides.forEach((s, k) => {
      const b = document.createElement('button'), n = document.createElement('span'), h = s.querySelector('h1, h2, h3');
      b.type = 'button';
      n.textContent = k + 1;
      b.append(n, h ? h.textContent : s.textContent.trim().slice(0, 50) || 'Slide');
      b.addEventListener('click', () => { postMessage({ slide: k }, '*'); gear.open = false; });
      nav.append(b);
    });
    gear.addEventListener('toggle', () => {
      const a = slides.findIndex(s => s.classList.contains('active'));
      [...nav.children].forEach((b, k) => b.toggleAttribute('aria-current', k === a));
    });
  }
  // each entry's symbol flips it (several need Shift or AltGr, so only Cmd/Ctrl/Alt are excluded)
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { gear.open = false; return; }
    if (e.metaKey || e.ctrlKey) return;
    const box = [...gear.querySelectorAll('input[data-opt][data-key]')].find(b => b.dataset.key === e.key);
    if (!box) return;
    e.preventDefault();
    box.checked = !box.checked;
    box.dispatchEvent(new Event('change'));
  });
})();
</script>




<button class="theme-toggle" type="button" aria-label="Switch light / dark" title="Light / dark (d): only for you, not saved">◐</button>
<script>
(() => {
  const root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)');
  const current = () => root.dataset.theme === 'auto' ? (mq.matches ? 'dark' : 'light') : root.dataset.theme;
  const flip = () => { root.dataset.theme = current() === 'dark' ? 'light' : 'dark'; };
  document.querySelector('.theme-toggle').addEventListener('click', e => { e.stopPropagation(); flip(); });
  addEventListener('keydown', e => { if (e.key === 'd' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey) flip(); });
  addEventListener('message', e => { if (e.data && ['auto','light','dark'].includes(e.data.theme)) root.dataset.theme = e.data.theme; });
})();
</script>
<script>
(() => {
  const root = document.documentElement;
  let t;
  const wake = () => { root.classList.remove('ss-idle'); clearTimeout(t); t = setTimeout(() => root.classList.add('ss-idle'), 2500); };
  ['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(e => addEventListener(e, wake, { passive: true }));
  wake();
})();
</script>
