/* ---------- slides (format: slides) ---------- */
.format-slides { overflow: hidden; height: 100vh; cursor: default; }
/* a slide is one screen. More content than fits scrolls inside the slide instead of running off the
   top and bottom edges ("safe center" keeps the first line reachable when it overflows). */

   token, so a style can make the change quicker, slower or instant (0s). */

  overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--rule) transparent;

.format-slides:has(.ss-logo) .ss-crumbs { left: calc(var(--logo-size, 40px) + 30px); margin: 0; }

/* document — neutral word-processor look for writing: white A4 sheet on a grey desk, plain sans, blue headings */
:root {
  --category: Business;
  --bg: #ffffff;
  --fg: #1f1f1f;
  --muted: #595959;
  --accent: #0563c1;
  --rule: #d9d9d9;
  --code-bg: #f2f2f2;
  --font-body: Aptos, Calibri, "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-head: var(--font-body);
  --font-mono: Consolas, ui-monospace, "SF Mono", Menlo, monospace;
  --size: 16px;

<script>
(() => {
  const root = document.documentElement, gear = document.querySelector('.ss-gear');
  const send = (key, value) => {
    dispatchEvent(new CustomEvent('ss-note', { detail: { key, value } }));
    if (parent !== window) parent.postMessage({ ssNote: { key, value } }, '*');
  };
  const fieldOf = k => gear.querySelector('[data-note="' + k + '"]:not([data-opt])');
  gear.querySelectorAll('input[data-opt]').forEach(box => {
    const k = box.dataset.opt, field = box.dataset.field && fieldOf(box.dataset.field);
    const apply = () => root.classList.toggle('ss-no-' + k, !box.checked);
    // a switch with a value beside it (clock format, timer minutes) writes that value, or "off"
    box.addEventListener('change', () => { apply(); send(box.dataset.note, field ? (box.checked ? field.value : 'off') : String(box.checked)); });
    apply();
  });
  gear.querySelectorAll('[data-note]:not([data-opt])').forEach(field => {
    field.addEventListener('change', () => {
      const box = gear.querySelector('input[data-field="' + field.dataset.note + '"]');
      if (box && !box.checked) { box.checked = true; root.classList.remove('ss-no-' + box.dataset.opt); }
      send(field.dataset.note, field.value);
    });
    field.addEventListener('click', e => e.stopPropagation());
    field.addEventListener('keydown', e => e.stopPropagation());
  });
  const nav = gear.querySelector('.ss-overview');
  if (nav) {
    const slides = [...document.querySelectorAll('.slide')];
    slides.forEach((s, k) => {
      const b = document.createElement('button'), n = document.createElement('span'), h = s.querySelector('h1, h2, h3');
      b.type = 'button';
      n.textContent = k + 1;
      b.append(n, h ? h.textContent : s.textContent.trim().slice(0, 50) || 'Slide');
      b.addEventListener('click', () => { postMessage({ slide: k }, '*'); gear.open = false; });
      nav.append(b);
    });
    gear.addEventListener('toggle', () => {
      const a = slides.findIndex(s => s.classList.contains('active'));
      [...nav.children].forEach((b, k) => b.toggleAttribute('aria-current', k === a));
    });
  }
  // each entry's symbol flips it (several need Shift or AltGr, so only Cmd/Ctrl/Alt are excluded)
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { gear.open = false; return; }
    if (e.metaKey || e.ctrlKey) return;
    const box = [...gear.querySelectorAll('input[data-opt][data-key]')].find(b => b.dataset.key === e.key);
    if (!box) return;
    e.preventDefault();
    box.checked = !box.checked;
    box.dispatchEvent(new Event('change'));
  });
})();
</script>
<script>
(() => {
  const root = document.documentElement;
  let loops = true;
  let total = 30 * 1000;
  const box = document.querySelector('.ss-gear input[data-play]');
  const slides = [...document.querySelectorAll('.slide')];
  const get = () => { try { return localStorage.getItem('artdefacts-play') === '1'; } catch (e) { return false; } };
  const save = v => { try { localStorage.setItem('artdefacts-play', v ? '1' : '0'); } catch (e) {} };
  const maxScroll = () => Math.max(0, root.scrollHeight - innerHeight);
  const ease = p => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
  let raf = 0, start = 0, shown = -1;

  const step = now => {
    const frac = (now - start) / total;
    if (slides.length) {
      const k = Math.min(slides.length - 1, Math.floor(frac * slides.length));
      if (k !== shown) { shown = k; postMessage({ slide: k }, '*'); }
    } else {
      scrollTo(0, frac * maxScroll());
    }
    if (frac >= 1) {
      if (!loops) return stop();
      if (slides.length) { start = now; shown = -1; }       // the fade carries the jump back
      else return rewind(scrollY);                          // a page rolls back up first
    }
    raf = requestAnimationFrame(step);
  };

  // smooth ride back to the top before the next pass
  const rewind = from => {
    const t0 = performance.now(), dur = Math.min(2500, Math.max(900, total * 0.12));
    const back = now => {
      const p = Math.min(1, (now - t0) / dur), e = ease(p);
      scrollTo(0, from * (1 - e));
      if (p < 1) { raf = requestAnimationFrame(back); return; }
      start = performance.now();
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(back);
  };

  const play = () => {
    if (raf) return;
    root.classList.add('ss-playing');
    if (box) box.checked = true;
    save(true);
    shown = slides.length ? slides.findIndex(s => s.classList.contains('active')) : -1;
    const done = slides.length ? shown / slides.length : (maxScroll() ? scrollY / maxScroll() : 0);
    start = performance.now() - done * total;
    raf = requestAnimationFrame(step);
  };
  const stop = () => {
    cancelAnimationFrame(raf); raf = 0;
    root.classList.remove('ss-playing');
    if (box) box.checked = false;
    save(false);
  };
  const toggle = () => (raf ? stop() : play());

  if (box) box.addEventListener('change', () => (box.checked ? play() : stop()));
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey) return;
    if (e.key === '>') return toggle();
    // any manual move takes over
    if (raf && ['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', ' ', 'Home', 'End'].includes(e.key)) stop();
  });
  ['wheel', 'touchstart', 'mousedown'].forEach(ev => addEventListener(ev, e => {
    if (raf && !(e.target.closest && e.target.closest('.ss-gear, .ss-player, .ss-timer'))) stop();
  }, { passive: true }));
  addEventListener('ss-note', e => {
    if (e.detail.key === 'autoplayEnd') { loops = e.detail.value === 'loop'; return; }
    if (e.detail.key !== 'autoplay') return;
    const secs = Math.max(5, Math.min(36000, +e.detail.value || 0));
    total = secs * 1000;
    if (raf) { stop(); play(); }      // restart the pass on the new clock
  });
  if (get()) play();
})();
</script>


<aside class="ss-player" aria-label="Music">
<div class="ss-player-tab" aria-hidden="true">♪</div><div class="ss-player-title"></div><div class="ss-player-bar"><div></div></div>
<div class="ss-player-ctrl"><button type="button" data-p="prev" aria-label="Previous">⏮</button><button type="button" data-p="play" aria-label="Play / pause (shift + M)" title="Play / pause (⇧M)">▶</button><button type="button" data-p="next" aria-label="Next">⏭</button><button type="button" data-p="shuffle" class="ss-shuffle" aria-label="Shuffle" title="Shuffle">🔀</button><button type="button" data-p="loop" class="ss-loop" aria-label="Loop"></button></div>
<ol class="ss-player-list"></ol>
<div class="ss-player-hint"></div>
<audio preload="metadata"></audio>
</aside>
<script>
(() => {
  const tracks = [];
  const box = document.querySelector('.ss-player'), audio = box.querySelector('audio'), title = box.querySelector('.ss-player-title'), list = box.querySelector('.ss-player-list');
  const bar = box.querySelector('.ss-player-bar'), fill = bar.firstElementChild, play = box.querySelector('[data-p="play"]'), loopBtn = box.querySelector('[data-p="loop"]');
  const LOOP = { all: ['🔁', 'Loop playlist'], one: ['🔂', 'Loop this track'], off: ['🔁', 'Loop off'] };
  const hint = box.querySelector('.ss-player-hint');
  let cur = tracks[0], loop = 'all', shuffle = false;
  const played = [];
  const drawHint = () => {
    const empty = !tracks.length;
    hint.textContent = empty ? 'Drop audio files here to play them' : 'Drag to reorder · drop audio files here';
    if (empty) title.textContent = 'Music';
    box.classList.toggle('is-empty', empty);
  };
  const drawLoop = () => { loopBtn.textContent = LOOP[loop][0]; loopBtn.title = LOOP[loop][1]; box.dataset.loop = loop; };
  const shuffleBtn = box.querySelector('[data-p="shuffle"]');
  const drawShuffle = () => { box.dataset.shuffle = shuffle ? 'on' : 'off'; shuffleBtn.title = shuffle ? 'Shuffle on' : 'Shuffle off'; };
  // a bag, not a dice roll: every other track plays once before any repeats
  let bag = [];
  const refill = () => {
    bag = tracks.filter(t => t !== cur);
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
  };
  const nextRandom = () => {
    if (tracks.length < 2) return cur;
    if (!bag.length) refill();
    return bag.pop();
  };
  const drawList = () => {
    list.replaceChildren(...tracks.map((t, k) => {
      const li = document.createElement('li');
      li.textContent = t.name; li.draggable = true; li.dataset.k = k;
      if (t === cur) li.setAttribute('aria-current', 'true');
      return li;
    }));
  };
  const load = (t, autoplay) => {
    if (!t) return;
    cur = t; title.textContent = t.name; fill.style.width = '0'; drawList(); drawHint();
    if (t.src) { audio.src = t.src; if (autoplay) audio.play().catch(() => {}); }
  };
  const step = (d, autoplay) => {
    if (!tracks.length) return;
    if (shuffle) {
      if (d > 0) { played.push(cur); return load(nextRandom(), autoplay); }
      const back = played.pop();
      return load(back || cur, autoplay);
    }
    const k = tracks.indexOf(cur) + d;
    load(tracks[(k + tracks.length) % tracks.length], autoplay);
  };
  const toggle = () => { if (!audio.src) return; audio.paused ? audio.play().catch(() => {}) : audio.pause(); };
  const saveOrder = () => { if (parent !== window) parent.postMessage({ ssPlaylist: tracks.filter(t => !t.local).map(t => t.name) }, '*'); };
  box.addEventListener('click', e => {
    const p = e.target.dataset && e.target.dataset.p;
    if (e.target.closest('li')) { e.stopPropagation(); load(tracks[+e.target.closest('li').dataset.k], true); return; }
    if (!p) return;
    e.stopPropagation();
    if (p === 'play') toggle();
    if (p === 'next' || p === 'prev') step(p === 'next' ? 1 : -1, !audio.paused);
    if (p === 'loop') { loop = loop === 'all' ? 'one' : loop === 'one' ? 'off' : 'all'; drawLoop(); }
    if (p === 'shuffle') { shuffle = !shuffle; played.length = 0; bag = []; drawShuffle(); }
  });
  bar.addEventListener('click', e => { e.stopPropagation(); const r = bar.getBoundingClientRect(); if (audio.duration) audio.currentTime = (e.clientX - r.left) / r.width * audio.duration; });
  audio.addEventListener('timeupdate', () => { fill.style.width = (audio.currentTime / audio.duration * 100 || 0) + '%'; });
  audio.addEventListener('play', () => { box.classList.add('playing'); play.textContent = '⏸'; });
  audio.addEventListener('pause', () => { box.classList.remove('playing'); play.textContent = '▶'; });
  audio.addEventListener('ended', () => {
    if (loop === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
    if (loop === 'off' && !shuffle && tracks.indexOf(cur) === tracks.length - 1) return;
    if (loop === 'off' && shuffle && !bag.length && played.length) return;  // the bag is empty: everything has played
    step(1, true);
  });
  // drag to reorder; drop audio files to add
  let dragK = -1;
  list.addEventListener('dragstart', e => { dragK = +e.target.dataset.k; e.dataTransfer.setData('text/plain', 'ss-track'); e.dataTransfer.effectAllowed = 'move'; });
  box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('dropping'); const li = e.target.closest && e.target.closest('li'); list.querySelectorAll('li').forEach(x => x.classList.toggle('over', x === li)); });
  box.addEventListener('dragleave', e => { if (!box.contains(e.relatedTarget)) { box.classList.remove('dropping'); } });
  box.addEventListener('drop', e => {
    e.preventDefault(); box.classList.remove('dropping');
    const li = e.target.closest && e.target.closest('li');
    if (dragK >= 0) {
      const to = li ? +li.dataset.k : tracks.length - 1;
      const [t] = tracks.splice(dragK, 1); tracks.splice(to, 0, t); dragK = -1;
      drawList(); saveOrder(); return;
    }
    const files = [...(e.dataTransfer.files || [])].filter(f => /^audio\//.test(f.type) || /\.(mp3|wav|flac|m4a|aac|ogg)$/i.test(f.name));
    files.forEach(f => tracks.push({ name: f.name.replace(/\.[^.]+$/, ''), src: URL.createObjectURL(f), local: true }));
    if (files.length && !audio.src) load(tracks[tracks.length - files.length], true); else { drawList(); drawHint(); }
  });
  list.addEventListener('dragend', () => { dragK = -1; list.querySelectorAll('li').forEach(x => x.classList.remove('over')); });
  addEventListener('keydown', e => { if (e.key === 'M' && e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey) toggle(); });
  addEventListener('message', e => {
    if (!e.data || !Array.isArray(e.data.ssAudio)) return;
    e.data.ssAudio.forEach(a => { const t = tracks.find(x => x.name === a.name); if (t) t.src = URL.createObjectURL(new Blob([a.buf], { type: a.type })); });
    load(cur);
  });
  drawLoop();
  drawShuffle();
  drawHint();
  drawList();
  load(cur);
})();
</script>

<script>
(() => {
  const root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)');
  const current = () => root.dataset.theme === 'auto' ? (mq.matches ? 'dark' : 'light') : root.dataset.theme;
  const flip = () => { root.dataset.theme = current() === 'dark' ? 'light' : 'dark'; };
  document.querySelector('.theme-toggle').addEventListener('click', e => { e.stopPropagation(); flip(); });
  addEventListener('keydown', e => { if (e.key === 'd' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey) flip(); });
  addEventListener('message', e => { if (e.data && ['auto','light','dark'].includes(e.data.theme)) root.dataset.theme = e.data.theme; });
})();
</script>
<script>
(() => {
  const root = document.documentElement;

  const wake = () => { root.classList.remove('ss-idle'); clearTimeout(t); t = setTimeout(() => root.classList.add('ss-idle'), 2500); };
  ['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(e => addEventListener(e, wake, { passive: true }));
  wake();
})();
